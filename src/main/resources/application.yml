server:
  port: 9001
  forward-headers-strategy: native

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: jdbc:mysql://${DB_ADDRESS}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  jwt:
    secret: ${JWT_SECRET_KEY}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
  sql:
    init:
      mode: always

rank:
  session:
    ttl: 3600 # seconds

community:
  puzzle:
    daily-upload-limit: 50 # in 24 hours

iap:
  google:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  apple:
    issuer-id: ${APPLE_IAP_ISSUER_ID:}
    key-id: ${APPLE_IAP_KEY_ID:}
    bundle-id: ${APPLE_IAP_BUNDLE_ID:com.renzzle}
    private-key-path: ${APPLE_IAP_PRIVATE_KEY_PATH:}
    production-url: https://api.storekit.itunes.apple.com
    sandbox-url: https://api.storekit-sandbox.itunes.apple.com

docs:
  enabled: ${DOCS_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  packages-to-scan: com.renzzle.backend
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

# For Prometheus (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true