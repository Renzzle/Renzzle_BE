server:
  port: 9001
  forward-headers-strategy: native

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: jdbc:mysql://${DB_ADDRESS}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  jwt:
    secret: ${JWT_SECRET_KEY}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          from: ${MAIL_FROM}
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2 TLSv1.3
  sql:
    init:
      mode: always

app:
  # Required in the x-app-key header of every /api request
  key: ${APP_KEY:}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Renzzle}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

rank:
  session:
    ttl: 3600 # seconds

community:
  puzzle:
    daily-upload-limit: 50 # in 24 hours

iap:
  google:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  apple:
    issuer-id: ${APPLE_IAP_ISSUER_ID:}
    key-id: ${APPLE_IAP_KEY_ID:}
    bundle-id: ${APPLE_IAP_BUNDLE_ID:com.renzzle}
    # Numeric Apple ID of the app (App Store Connect > App Information). Production notification signatures are
    # checked against it; without it production notifications are refused and Apple retries them
    app-apple-id: ${APPLE_IAP_APP_APPLE_ID:}
    private-key-path: ${APPLE_IAP_PRIVATE_KEY_PATH:}
    production-url: https://api.storekit.itunes.apple.com
    sandbox-url: https://api.storekit-sandbox.itunes.apple.com
  refund:
    # Withdrawal period under Korean e-commerce law (청약철회): refundable within this many days if unused
    withdrawal-days: 7
    google:
      # Reads Google Play's voided purchases every hour and takes back what they granted.
      # Off until the list on the admin page has been reviewed
      reclaim-enabled: ${IAP_GOOGLE_RECLAIM_ENABLED:false}
      # ISO-8601 instant such as 2026-10-20T00:00:00Z. Refunds Google made because the purchase was never
      # acknowledged (reason 8) take the reward back only from this time on; empty means never
      unacknowledged-reclaim-since: ${IAP_GOOGLE_UNACKNOWLEDGED_RECLAIM_SINCE:}

docs:
  enabled: ${DOCS_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  packages-to-scan: com.renzzle.backend
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

# For Prometheus (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true