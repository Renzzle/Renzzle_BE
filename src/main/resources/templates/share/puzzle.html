<!DOCTYPE html>
<html lang="ko" th:lang="${text.lang}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${text.title} + ' - Renzzle'">Renzzle</title>
  <meta name="description" th:content="${text.description}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Renzzle">
  <meta property="og:title" th:content="${text.title}">
  <meta property="og:description" th:content="${text.description}">
  <meta property="og:url" th:content="${pageUrl}">
  <meta property="og:image" th:content="${previewImageUrl}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/image/app-icon.png" type="image/png">
  <link rel="preload" href="/assets/fonts/pretendard-1.3.9/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/share/share.css">
</head>
<body th:attr="data-token=${puzzle != null} ? ${token} : null,
               data-board=${puzzle != null} ? ${puzzle.boardStatus} : null">
<!--/* Phones on their side are asked to turn upright rather than laid out for */-->
<div class="rotate">
  <svg width="40" height="40" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="12"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="64" y="24" width="128" height="208" rx="16"/><path d="M64 56H192M64 200H192"/>
  </svg>
  <p th:text="${text.rotate}">세로 화면으로 돌려 주세요</p>
</div>

<!--/* The App Store on Apple devices, Google Play everywhere else */-->
<a th:if="${storeUrl}" class="app-banner" th:href="${storeUrl}" rel="noopener">
  <img class="app-banner-icon" src="/assets/image/app-icon.png" alt="">
  <span class="app-banner-text">
    <b>Renzzle</b>
    <span th:text="${text.bannerText}">앱에서 더 많은 퍼즐을 풀어 보세요</span>
  </span>
  <span class="app-banner-button" th:text="${text.bannerButton}">앱으로 보기</span>
</a>

<main class="page">
  <section th:if="${puzzle}" class="stage">
    <div class="goal">
      <div class="goal-line">
        <span th:class="${puzzle.winColor == 'BLACK'} ? 'stone stone-black' : 'stone stone-white'"></span>
        <h1 th:text="${text.goal}">흑으로 오목을 만드세요</h1>
        <!--/* Phosphor Icons (MIT); the retry arc is the one redrawn for the app design */-->
        <button type="button" id="retryButton" class="icon-button" disabled
                th:aria-label="${text.retry}">
          <svg width="24" height="24" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M51.60 91.84A84 84 0 1 1 51.60 188.20"/><path d="M111.45 96.02L51.60 91.84L55.78 31.98"/>
          </svg>
        </button>
      </div>
      <p class="goal-meta">
        <th:block th:text="${text.authorPrefix}"></th:block><b class="author" th:text="${puzzle.authorName}">오목고수</b><th:block
            th:text="${text.authorSuffix}">님 출제</th:block><th:block th:text="${text.meta}"> · 깊이 5 · 인증 퍼즐</th:block>
      </p>
    </div>

    <div class="board-frame">
      <canvas id="board" width="480" height="480" th:aria-label="${text.board}"></canvas>
    </div>

    <div class="dock">
      <div class="social">
        <!--/* Shows the count only; likes are given in the app */-->
        <span class="likes" th:aria-label="${text.likes}">
          <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M237,77.47A28,28,0,0,0,216,68H164V56a44.05,44.05,0,0,0-44-44,12,12,0,0,0-10.73,6.63L72.58,92H32a20,20,0,0,0-20,20v88a20,20,0,0,0,20,20H204a28,28,0,0,0,27.78-24.53l12-96A28,28,0,0,0,237,77.47ZM36,116H68v80H36ZM220,96.5l-12,96a4,4,0,0,1-4,3.5H92V106.83L126.82,37.2A20,20,0,0,1,140,56V80a12,12,0,0,0,12,12h64a4,4,0,0,1,4,4.5Z"/>
          </svg>
          <span th:text="${puzzle.likeCount}">0</span>
        </span>
        <span class="counts" th:text="${text.counts}">풀이 0 · 조회 0</span>
      </div>
      <p th:if="${puzzle.description != null and !#strings.isEmpty(puzzle.description)}"
         class="memo" th:text="${puzzle.description}">description</p>
    </div>
    <output id="status" class="hint" aria-live="polite"></output>

    <!--/* Comes up from the bottom when the puzzle ends */-->
    <div id="result" class="result" hidden>
      <p class="result-title"><span class="result-icon"></span><span id="resultText"></span></p>
      <div class="result-actions">
        <button type="button" id="resultRetry" class="result-button" th:text="${text.retry}">다시 하기</button>
        <a th:if="${storeUrl}" class="result-button result-button-main" th:href="${storeUrl}" rel="noopener"
           th:text="${text.more}">앱에서 더 풀기</a>
      </div>
    </div>
  </section>

  <section th:unless="${puzzle}" class="not-found">
    <h1 th:text="${text.title}">퍼즐을 찾을 수 없어요</h1>
    <p th:text="${text.description}">삭제되었거나 잘못된 링크예요.</p>
  </section>

</main>


<th:block th:if="${puzzle}">
  <script src="/assets/share/board.js"></script>
  <script src="/assets/engine/engine.js"></script>
  <script src="/assets/share/puzzle.js"></script>
</th:block>
</body>
</html>
