<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Renzzle Email Verification</title>
    </head>
    <body style="font-family: Arial, sans-serif; background-color: #F7F5F0; margin: 0; padding: 0;">
        <div style="max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
            <div style="background-color: #2A2824; color: #ffffff; padding: 20px; text-align: center; border-top-left-radius: 8px; border-top-right-radius: 8px;">
                <h2 style="margin: 0; font-size: 24px; color: #ffffff;">Renzzle</h2>
            </div>
            <div style="padding: 30px; text-align: center;">
                <h1 style="color: #26241F; margin-bottom: 20px; font-size: 28px;">Email Verification</h1>
                <p style="color: #57534C; line-height: 1.6; margin-bottom: 30px; font-size: 16px;">
                    Enter the code below to verify your email.
                </p>
                <div style="font-size: 30px; font-weight: bold; color: #26241F; background-color: #F7F5F0; padding: 15px; border-radius: 4px; letter-spacing: 4px; display: inline-block;">
                    <span th:text="${verificationCode}">123456</span>
                </div>
                <p style="color: #716C64; margin-top: 30px; font-size: 14px;">This code is valid for 5 minutes.</p>
            </div>
            <div style="background-color: #F7F5F0; color: #716C64; text-align: center; padding: 15px; font-size: 12px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                &copy; <th:block th:text="${#temporals.year(#temporals.createNow())}">2026</th:block> Studio Isoo. All rights reserved.
            </div>
        </div>
    </body>
</html>
