<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.communityPuzzles">Renzzle Admin - Community Puzzles</title>
  <link rel="preload" href="/assets/fonts/pretendard-1.3.9/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/admin/community-puzzles.css">
  <link rel="stylesheet" href="/assets/admin/common.css">
  <script src="/assets/admin/i18n.js"></script>
  <script src="/assets/admin/board.js"></script>
</head>
<body>
  <div class="header">
    <div>
      <h1>Renzzle Admin</h1>
      <span class="user-info" th:if="${userEmail}" th:text="${userEmail}"></span>
    </div>
    <div class="header-actions">
      <th:block th:replace="~{admin/fragments :: languageSelect}"></th:block>
      <a href="/admin/logout" class="btn" data-i18n="common.logout">Log out</a>
    </div>
  </div>

  <th:block th:replace="~{admin/fragments :: siteNav('communityPuzzles')}"></th:block>
  <th:block th:replace="~{admin/fragments :: uiKit}"></th:block>

  <main class="admin-shell">
    <div class="admin-page-heading">
      <div>
        <h2 data-i18n="communityPuzzles.heading">Community Puzzles</h2>
        <p data-i18n="communityPuzzles.description">Review puzzles waiting for verification and update their status.</p>
      </div>
    </div>

    <section class="section">
      <div class="section-title-row community-toolbar">
        <div>
          <h2 data-i18n="communityPuzzles.listHeading">Puzzle List</h2>
          <div id="communityListCount" class="pack-list-count muted-status"></div>
        </div>
        <div class="community-toolbar-controls">
          <form class="community-open-form" id="communitySearchForm">
            <label for="communityPuzzleId">
              <span class="admin-visually-hidden" data-i18n="cacheList.puzzleNumber">Puzzle Number</span>
              <input type="number" id="communityPuzzleId" min="1" data-i18n-placeholder="communityPuzzles.searchPlaceholder" placeholder="Puzzle number" autocomplete="off">
            </label>
            <button type="submit" class="btn" id="communitySearchBtn" data-i18n="communityPuzzles.open">Open</button>
          </form>
          <fieldset class="difficulty-segment community-filter">
            <legend class="admin-visually-hidden" data-i18n="communityPuzzles.filterLabel">Verification filter</legend>
            <button type="button" class="difficulty-option" data-verified="false" aria-pressed="true" data-i18n="communityPuzzles.unverified">Unverified</button>
            <button type="button" class="difficulty-option" data-verified="" aria-pressed="false" data-i18n="communityPuzzles.all">All</button>
          </fieldset>
        </div>
      </div>

      <div id="communityListEmpty" class="admin-empty" hidden>
        <span data-i18n="communityPuzzles.listEmpty">No puzzles to show.</span>
      </div>
      <div id="communityGrid" class="puzzle-preview-grid community-grid"></div>
      <nav id="communityPagination" class="community-pagination" aria-label="Pages" data-i18n-aria-label="communityPuzzles.pagination"></nav>
    </section>
  </main>

  <dialog id="communityDetailDialog" class="community-detail-dialog" aria-labelledby="communityDetailTitle">
    <div class="community-detail-header">
      <div class="community-detail-title">
        <h3 id="communityDetailTitle">#</h3>
        <span id="communityDetailStatus" class="admin-pill status"></span>
      </div>
      <button type="button" class="btn btn-sm" id="communityDetailClose" data-i18n="communityPuzzles.close">Close</button>
    </div>

    <div class="community-detail-body">
      <div class="community-board-wrap">
        <canvas id="communityBoardCanvas" width="360" height="360" aria-label="Community puzzle board" data-i18n-aria-label="communityPuzzles.boardLabel"></canvas>
        <div class="community-answer-toolbar" aria-label="Answer move navigation" data-i18n-aria-label="communityPuzzles.answerNavigation">
          <button type="button" class="btn board-icon-btn" id="communityAnswerPrevBtn" title="Previous answer move" aria-label="Previous answer move" data-i18n-title="communityPuzzles.previousAnswerMove" data-i18n-aria-label="communityPuzzles.previousAnswerMove">◀</button>
          <span id="communityAnswerStep" class="community-answer-step">0 / 0</span>
          <button type="button" class="btn board-icon-btn" id="communityAnswerNextBtn" title="Next answer move" aria-label="Next answer move" data-i18n-title="communityPuzzles.nextAnswerMove" data-i18n-aria-label="communityPuzzles.nextAnswerMove">▶</button>
          <button type="button" class="btn community-copy-btn" id="communityCopySequenceBtn" data-i18n="communityPuzzles.copySequence">Copy moves</button>
        </div>
      </div>

      <div class="community-puzzle-controls">
        <div class="community-verification-card">
          <span class="community-verification-label" data-i18n="communityPuzzles.verification">Verification Status</span>
          <label class="community-switch" for="communityIsVerified">
            <span class="admin-visually-hidden" data-i18n="communityPuzzles.verification">Verification Status</span>
            <input type="checkbox" id="communityIsVerified">
            <span class="community-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="community-answer-edit">
          <label for="communityAnswerInput" data-i18n="communityPuzzles.answerLabel">Answer</label>
          <input type="text" id="communityAnswerInput" autocomplete="off" spellcheck="false" aria-describedby="communityAnswerHint">
          <p class="community-answer-hint" id="communityAnswerHint"></p>
        </div>
        <dl class="community-meta">
          <div><dt data-i18n="common.author">Author</dt><dd id="communityMetaAuthor">-</dd></div>
          <div><dt data-i18n="common.depth">Depth</dt><dd id="communityMetaDepth">-</dd></div>
          <div><dt data-i18n="common.winColor">Win Color</dt><dd id="communityMetaWinColor">-</dd></div>
          <div><dt data-i18n="communityPuzzles.createdAt">Created</dt><dd id="communityMetaCreated">-</dd></div>
          <div class="community-meta-wide"><dt data-i18n="communityPuzzles.stats">Solved · Likes · Views</dt><dd id="communityMetaStats">-</dd></div>
          <div class="community-meta-wide"><dt data-i18n="common.description">Description</dt><dd id="communityMetaDescription">-</dd></div>
        </dl>
      </div>
    </div>

    <div class="community-detail-footer">
      <button type="button" class="btn" id="communityPrevPuzzle" data-i18n="communityPuzzles.previousPuzzle">Previous</button>
      <span id="communityDetailPosition" class="muted-status"></span>
      <button type="button" class="btn" id="communityNextPuzzle" data-i18n="communityPuzzles.nextPuzzle">Next</button>
    </div>
  </dialog>

  <script type="module">
    const API_BASE = '';
    const PAGE_SIZE = 12;

    /**
     * @typedef {Object} CommunityPuzzle
     * @property {number} id
     * @property {string} boardStatus
     * @property {string} answer
     * @property {string} authorName
     * @property {string} description
     * @property {number} depth
     * @property {string} winColor
     * @property {number} solvedCount
     * @property {number} views
     * @property {number} likeCount
     * @property {string} createdAt
     * @property {boolean} isVerified
     */

    /** @type {CommunityPuzzle|null} */
    let currentPuzzle = null;
    let currentAnswerStep = 0;
    let listFilter = 'false';
    let listPage = 0;
    let listTotalPages = 0;
    let listTotalCount = 0;
    /** @type {CommunityPuzzle[]} */
    let listPuzzles = [];

    async function fetchWithAuth(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (options.body === undefined || options.body === null) {
        delete headers['Content-Type'];
      }
      const res = await fetch(url, { ...options, headers, credentials: 'same-origin' });
      if (res.status === 401 || res.status === 403) {
        const error = await res.clone().json().catch(() => null);
        if (error?.errorResponse?.code === 'A4031') {
          alert(adminT('msg.permissionDenied'));
          return null;
        }
        alert(adminT('msg.sessionExpired'));
        globalThis.location.href = '/admin/logout';
        return null;
      }
      return res;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || '-';
      const pad = n => String(n).padStart(2, '0');
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
        + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    function isWhite(winColor) {
      return String(winColor).toUpperCase() === 'WHITE';
    }

    function setStatusPill(pill, puzzle) {
      pill.className = 'admin-pill status' + (puzzle.isVerified ? '' : ' off');
      adminSetText(pill, puzzle.isVerified ? 'communityPuzzles.verified' : 'communityPuzzles.unverified');
    }

    function colorChip(winColor) {
      const chip = document.createElement('span');
      chip.className = 'puzzle-preview-color ' + (isWhite(winColor) ? 'is-white' : 'is-black');
      adminSetText(chip, isWhite(winColor) ? 'common.white' : 'common.black');
      return chip;
    }

    // ===== List =====

    function createCard(puzzle, index) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'puzzle-preview-card community-card';
      card.dataset.puzzleId = String(puzzle.id);

      const header = document.createElement('div');
      header.className = 'puzzle-preview-header';
      const number = document.createElement('span');
      number.className = 'puzzle-preview-number';
      number.textContent = '#' + puzzle.id;
      const pill = document.createElement('span');
      setStatusPill(pill, puzzle);
      header.append(number, pill);

      const board = document.createElement('canvas');
      board.className = 'puzzle-preview-board';
      board.setAttribute('aria-hidden', 'true');

      const meta = document.createElement('div');
      meta.className = 'community-card-meta';
      const author = document.createElement('span');
      author.className = 'community-card-author';
      author.textContent = puzzle.authorName || '-';
      const depth = document.createElement('span');
      adminSetText(depth, 'communityPuzzles.depthValue', { depth: puzzle.depth });
      meta.append(colorChip(puzzle.winColor), author, depth);

      const date = document.createElement('div');
      date.className = 'community-card-date';
      date.textContent = formatDate(puzzle.createdAt);

      card.append(header, board, meta, date);
      card.addEventListener('click', () => openDetail(puzzle, index));
      adminBoard.drawPreview(board, adminBoard.parseMoves(puzzle.boardStatus));
      return card;
    }

    function renderList() {
      const grid = document.getElementById('communityGrid');
      grid.innerHTML = '';
      listPuzzles.forEach((puzzle, index) => grid.appendChild(createCard(puzzle, index)));
      grid.hidden = listPuzzles.length === 0;
      document.getElementById('communityListEmpty').hidden = listPuzzles.length > 0;
    }

    function renderPagination() {
      const nav = document.getElementById('communityPagination');
      nav.innerHTML = '';
      nav.hidden = listTotalPages <= 1;
      if (listTotalPages <= 1) return;

      const addButton = (label, target, options = {}) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-sm' + (options.current ? ' btn-primary' : '');
        button.textContent = label;
        button.disabled = options.disabled === true;
        if (options.labelKey) button.setAttribute('aria-label', adminT(options.labelKey));
        if (options.current) button.setAttribute('aria-current', 'page');
        button.addEventListener('click', () => loadList(target));
        nav.appendChild(button);
      };

      addButton('‹', listPage - 1, { disabled: listPage <= 0, labelKey: 'communityPuzzles.previousPage' });
      const first = Math.max(0, Math.min(listPage - 2, listTotalPages - 5));
      const last = Math.min(listTotalPages - 1, first + 4);
      for (let i = first; i <= last; i += 1) {
        addButton(String(i + 1), i, { current: i === listPage });
      }
      addButton('›', listPage + 1, { disabled: listPage >= listTotalPages - 1, labelKey: 'communityPuzzles.nextPage' });
    }

    async function loadList(page) {
      const params = new URLSearchParams({ page: String(Math.max(0, page)), size: String(PAGE_SIZE) });
      if (listFilter !== '') params.set('verified', listFilter);
      try {
        const res = await fetchWithAuth(API_BASE + '/admin/community/puzzle-manage?' + params);
        if (!res) return false;
        const data = await res.json();
        if (!res.ok || !data.isSuccess || !data.response) {
          adminToast(adminT('communityPuzzles.listFailed'), 'error');
          return false;
        }
        /** @type {{ puzzles: CommunityPuzzle[], page: number, size: number, totalCount: number, totalPages: number }} */
        const result = data.response;
        // A page emptied by earlier verifications falls back to the last page that still has puzzles
        if (result.puzzles.length === 0 && result.page > 0 && result.totalPages > 0) {
          return loadList(result.totalPages - 1);
        }
        listPage = result.page;
        listTotalPages = result.totalPages;
        listTotalCount = result.totalCount;
        listPuzzles = result.puzzles;
        adminSetText(document.getElementById('communityListCount'), 'communityPuzzles.listCount', { count: result.totalCount });
        renderList();
        renderPagination();
        return true;
      } catch (err) {
        adminToast(adminT('common.errorPrefix', { message: err.message || '' }), 'error');
        return false;
      }
    }

    function syncFilterButtons() {
      document.querySelectorAll('[data-verified]').forEach(button => {
        const active = button.dataset.verified === listFilter;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    // ===== Detail dialog =====

    let currentIndex = -1;
    // The answer field's text; the board, the step count and the copy follow it before it is saved
    let answerDraft = '';

    function getAnswerMoves() {
      if (!currentPuzzle) return [];
      const baseMoveCount = adminBoard.parseMoves(currentPuzzle.boardStatus || '').length;
      return adminBoard.parseMoves(answerDraft, baseMoveCount);
    }

    // Moves like h8i9, each on a point the board and the earlier answer moves leave empty
    function isAnswerDraftValid() {
      if (!/^([a-o](1[0-5]|[1-9]))+$/.test(answerDraft)) return false;
      const taken = new Set(adminBoard.parseMoves(currentPuzzle.boardStatus).map(move => move.row + ',' + move.col));
      return getAnswerMoves().every(move => {
        const point = move.row + ',' + move.col;
        if (taken.has(point)) return false;
        taken.add(point);
        return true;
      });
    }

    // A verified puzzle keeps its answer, so it is changed by verifying again
    function renderAnswerField(resetValue) {
      const input = document.getElementById('communityAnswerInput');
      const hint = document.getElementById('communityAnswerHint');
      const locked = Boolean(currentPuzzle.isVerified);
      const invalid = !locked && !isAnswerDraftValid();
      if (resetValue) input.value = answerDraft;
      input.disabled = locked;
      input.setAttribute('aria-invalid', String(invalid));
      hint.classList.toggle('is-error', invalid);
      let hintKey = 'communityPuzzles.answerHint';
      if (locked) {
        hintKey = 'communityPuzzles.answerLockedHint';
      } else if (invalid) {
        hintKey = 'communityPuzzles.answerInvalid';
      }
      adminSetText(hint, hintKey);
    }

    function drawCommunityBoard() {
      const baseMoves = adminBoard.parseMoves(currentPuzzle?.boardStatus);
      const answerStones = getAnswerMoves().slice(0, currentAnswerStep)
        .map((move, index) => ({ ...move, number: index + 1 }));
      adminBoard.drawPreview(document.getElementById('communityBoardCanvas'), baseMoves.concat(answerStones));
    }

    // The stones on the board as one move string, answer moves included up to the current step
    async function copySequence() {
      const baseMoves = adminBoard.parseMoves(currentPuzzle?.boardStatus);
      const sequence = adminBoard.formatMoves(baseMoves.concat(getAnswerMoves().slice(0, currentAnswerStep)));
      try {
        await navigator.clipboard.writeText(sequence);
        adminToast(adminT('communityPuzzles.sequenceCopied'), 'success');
      } catch {
        adminToast(adminT('communityPuzzles.sequenceCopyFailed'), 'error');
      }
    }

    function updateAnswerNavigation() {
      const total = getAnswerMoves().length;
      currentAnswerStep = Math.max(0, Math.min(currentAnswerStep, total));
      document.getElementById('communityAnswerStep').textContent = adminT('communityPuzzles.answerProgress', {
        current: currentAnswerStep,
        total
      });
      document.getElementById('communityAnswerPrevBtn').disabled = currentAnswerStep <= 0;
      document.getElementById('communityAnswerNextBtn').disabled = currentAnswerStep >= total;
      drawCommunityBoard();
    }

    function renderDetail(options = {}) {
      const puzzle = currentPuzzle;
      if (!options.keepAnswerStep) {
        answerDraft = puzzle.answer || '';
      }
      currentAnswerStep = options.keepAnswerStep ? currentAnswerStep : getAnswerMoves().length;
      document.getElementById('communityDetailTitle').textContent = '#' + puzzle.id;
      setStatusPill(document.getElementById('communityDetailStatus'), puzzle);
      document.getElementById('communityIsVerified').checked = Boolean(puzzle.isVerified);
      document.getElementById('communityMetaAuthor').textContent = puzzle.authorName || '-';
      document.getElementById('communityMetaDepth').textContent = String(puzzle.depth ?? '-');
      adminSetText(document.getElementById('communityMetaWinColor'), isWhite(puzzle.winColor) ? 'common.white' : 'common.black');
      document.getElementById('communityMetaCreated').textContent = formatDate(puzzle.createdAt);
      document.getElementById('communityMetaStats').textContent =
        [puzzle.solvedCount, puzzle.likeCount, puzzle.views].map(value => String(value ?? 0)).join(' · ');
      const description = document.getElementById('communityMetaDescription');
      if (puzzle.description) {
        delete description.dataset.i18n;
        description.textContent = puzzle.description;
      } else {
        adminSetText(description, 'common.noDescription');
      }

      // Opened by number, it may not be on this page, so there is no previous or next to walk to
      const inList = currentIndex >= 0;
      const position = document.getElementById('communityDetailPosition');
      position.textContent = inList
        ? adminT('communityPuzzles.position', { current: listPage * PAGE_SIZE + currentIndex + 1, total: listTotalCount })
        : '';
      document.getElementById('communityPrevPuzzle').disabled = !inList || (currentIndex === 0 && listPage === 0);
      document.getElementById('communityNextPuzzle').disabled = !inList
        || (currentIndex === listPuzzles.length - 1 && listPage >= listTotalPages - 1);
      renderAnswerField(true);
      updateAnswerNavigation();
    }

    function openDetail(puzzle, index) {
      currentPuzzle = puzzle;
      currentIndex = index;
      renderDetail();
      const dialog = document.getElementById('communityDetailDialog');
      if (!dialog.open) dialog.showModal();
    }

    // Pages shift as puzzles get verified, so the neighbor is the next smaller (or larger) id, not the next slot
    async function moveDetail(step) {
      const fromId = currentPuzzle.id;
      const findNeighbor = () => {
        const indexes = listPuzzles.map((puzzle, index) => index)
          .filter(index => step > 0 ? listPuzzles[index].id < fromId : listPuzzles[index].id > fromId);
        return indexes.length ? indexes[step > 0 ? 0 : indexes.length - 1] : -1;
      };
      let index = findNeighbor();
      for (const page of step > 0 ? [listPage, listPage + 1] : [listPage - 1]) {
        if (index >= 0) break;
        if (page < 0 || !(await loadList(page))) return;
        index = findNeighbor();
      }
      if (index >= 0) openDetail(listPuzzles[index], index);
    }

    async function openByNumber(event) {
      event.preventDefault();
      const puzzleId = document.getElementById('communityPuzzleId').value.trim();
      if (!puzzleId) return;
      const button = document.getElementById('communitySearchBtn');
      button.disabled = true;
      try {
        const res = await fetchWithAuth(API_BASE + '/admin/community/puzzle-manage/' + encodeURIComponent(puzzleId));
        if (!res) return;
        const data = await res.json();
        if (!res.ok || !data.isSuccess || !data.response) {
          adminToast(adminT('communityPuzzles.noPuzzle'), 'warn');
          return;
        }
        openDetail(data.response, listPuzzles.findIndex(puzzle => puzzle.id === data.response.id));
      } catch (err) {
        adminToast(adminT('common.errorPrefix', { message: err.message || '' }), 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function saveVerification() {
      if (!currentPuzzle) return;
      const verificationInput = document.getElementById('communityIsVerified');
      const previousValue = Boolean(currentPuzzle.isVerified);
      const nextValue = verificationInput.checked;
      const answerEdited = nextValue && answerDraft !== (currentPuzzle.answer || '');
      if (answerEdited && !isAnswerDraftValid()) {
        verificationInput.checked = previousValue;
        adminToast(adminT('communityPuzzles.answerInvalid'), 'error');
        return;
      }
      verificationInput.disabled = true;
      try {
        const res = await fetchWithAuth(API_BASE + '/admin/community/puzzle-manage/' + encodeURIComponent(currentPuzzle.id) + '/verification', {
          method: 'PATCH',
          body: JSON.stringify({
            isVerified: nextValue,
            answer: answerEdited ? answerDraft : undefined
          })
        });
        if (!res) return;
        const data = await res.json();
        if (!res.ok || !data.isSuccess || !data.response) {
          verificationInput.checked = previousValue;
          adminToast(adminT('communityPuzzles.saveFailed'), 'error');
          return;
        }
        currentPuzzle = data.response;
        answerDraft = currentPuzzle.answer || '';
        renderDetail({ keepAnswerStep: true });
        // The card keeps its place with the new status until the list reloads
        listPuzzles = listPuzzles.map(puzzle => puzzle.id === data.response.id ? data.response : puzzle);
        renderList();
        let savedKey = currentPuzzle.isVerified ? 'communityPuzzles.markedVerified' : 'communityPuzzles.markedUnverified';
        if (answerEdited) savedKey = 'communityPuzzles.markedVerifiedWithAnswer';
        adminToast(adminT(savedKey, { id: currentPuzzle.id }), 'success');
      } catch (err) {
        verificationInput.checked = previousValue;
        adminToast(adminT('common.errorPrefix', { message: err.message || '' }), 'error');
      } finally {
        verificationInput.disabled = false;
      }
    }

    const dialog = document.getElementById('communityDetailDialog');
    document.getElementById('communityDetailClose').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
    document.getElementById('communityPrevPuzzle').addEventListener('click', () => moveDetail(-1));
    document.getElementById('communityNextPuzzle').addEventListener('click', () => moveDetail(1));
    document.querySelectorAll('[data-verified]').forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.verified === listFilter) return;
        listFilter = button.dataset.verified;
        syncFilterButtons();
        loadList(0);
      });
    });
    document.getElementById('communitySearchForm').addEventListener('submit', openByNumber);
    document.getElementById('communityIsVerified').addEventListener('change', saveVerification);
    document.getElementById('communityAnswerPrevBtn').addEventListener('click', () => {
      currentAnswerStep -= 1;
      updateAnswerNavigation();
    });
    document.getElementById('communityAnswerNextBtn').addEventListener('click', () => {
      currentAnswerStep += 1;
      updateAnswerNavigation();
    });
    document.getElementById('communityCopySequenceBtn').addEventListener('click', copySequence);
    document.getElementById('communityAnswerInput').addEventListener('input', (event) => {
      answerDraft = event.target.value.replace(/\s+/g, '').toLowerCase();
      currentAnswerStep = getAnswerMoves().length;
      renderAnswerField(false);
      updateAnswerNavigation();
    });
    document.addEventListener('admin:language-change', () => {
      if (currentPuzzle && dialog.open) {
        renderDetail({ keepAnswerStep: true });
      }
      renderPagination();
    });

    syncFilterButtons();
    await loadList(0);
  </script>
</body>
</html>
