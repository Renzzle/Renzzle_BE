<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.communityPuzzles">Renzzle Admin - Community Puzzles</title>
  <link rel="stylesheet" href="/assets/admin/community-puzzles.css">
  <link rel="stylesheet" href="/assets/admin/common.css">
  <script src="/assets/admin/i18n.js"></script>
</head>
<body>
  <div class="header">
    <div>
      <h1>Renzzle Admin</h1>
      <span class="user-info" th:if="${userEmail}" th:text="${userEmail}"></span>
    </div>
    <div class="header-actions">
      <th:block th:replace="~{admin/fragments :: languageSelect}"></th:block>
      <a href="/admin/logout" class="btn" data-i18n="common.logout">Log out</a>
    </div>
  </div>

  <th:block th:replace="~{admin/fragments :: siteNav(false, false, false, true)}"></th:block>
  <th:block th:replace="~{admin/fragments :: uiKit}"></th:block>

  <main class="admin-shell">
    <div class="admin-page-heading">
      <div>
        <h2 data-i18n="communityPuzzles.heading">Community Puzzles</h2>
        <p data-i18n="communityPuzzles.description">Search a community puzzle by number and update its verification status.</p>
      </div>
    </div>

    <section class="section">
      <div class="section-title-row community-title-row">
        <div>
          <h2 data-i18n="communityPuzzles.detailHeading">Puzzle Information</h2>
        </div>
        <form class="community-management-search" id="communitySearchForm">
          <label for="communityPuzzleId">
            <span class="admin-visually-hidden" data-i18n="cacheList.puzzleNumber">Puzzle Number</span>
            <input type="number" id="communityPuzzleId" min="1" data-i18n-placeholder="communityPuzzles.searchPlaceholder" placeholder="Puzzle number" autocomplete="off">
          </label>
          <button type="submit" class="btn btn-primary community-search-btn" id="communitySearchBtn" data-i18n="common.search">Search</button>
        </form>
      </div>

      <div id="communityPuzzleStatus" class="community-search-status" aria-live="polite" hidden></div>

      <div id="communityPuzzlePanel" class="community-puzzle-panel" hidden>
        <div class="community-board-layout">
          <div class="community-board-wrap">
            <canvas id="communityBoardCanvas" width="360" height="360" aria-label="Community puzzle board" data-i18n-aria-label="communityPuzzles.boardLabel"></canvas>
            <div class="community-answer-toolbar" aria-label="Answer move navigation" data-i18n-aria-label="communityPuzzles.answerNavigation">
              <button type="button" class="btn board-icon-btn" id="communityAnswerPrevBtn" title="Previous answer move" aria-label="Previous answer move" data-i18n-title="communityPuzzles.previousAnswerMove" data-i18n-aria-label="communityPuzzles.previousAnswerMove">◀</button>
              <span id="communityAnswerStep" class="community-answer-step">0 / 0</span>
              <button type="button" class="btn board-icon-btn" id="communityAnswerNextBtn" title="Next answer move" aria-label="Next answer move" data-i18n-title="communityPuzzles.nextAnswerMove" data-i18n-aria-label="communityPuzzles.nextAnswerMove">▶</button>
            </div>
          </div>

          <div class="community-puzzle-controls">
            <div class="community-verification-card">
              <span class="community-verification-label" data-i18n="communityPuzzles.verification">Verification Status</span>
              <label class="community-switch" for="communityIsVerified">
                <span class="admin-visually-hidden" data-i18n="communityPuzzles.verification">Verification Status</span>
                <input type="checkbox" id="communityIsVerified">
                <span class="community-switch-track" aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    const API_BASE = '';
    let currentPuzzle = null;
    let currentAnswerStep = 0;

    async function fetchWithAuth(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (options.body === undefined || options.body === null) {
        delete headers['Content-Type'];
      }
      const res = await fetch(url, { ...options, headers, credentials: 'same-origin' });
      if (res.status === 401 || res.status === 403) {
        alert(adminT('msg.sessionExpired'));
        globalThis.location.href = '/admin/logout';
        return null;
      }
      return res;
    }

    function setStatus(message) {
      const status = document.getElementById('communityPuzzleStatus');
      status.textContent = message;
      status.hidden = !message;
    }

    function boardStatusToMoves(boardStatus, startMoveIndex = 0) {
      const result = [];
      const regex = /([a-oA-O])([1-9]|1[0-5])/g;
      let match;
      let moveIndex = startMoveIndex;
      while ((match = regex.exec(boardStatus || '')) !== null) {
        const col = match[1].toLowerCase().charCodeAt(0) - 97;
        const row = Number(match[2]) - 1;
        result.push({
          row,
          col,
          player: moveIndex % 2 === 0 ? 'black' : 'white'
        });
        moveIndex += 1;
      }
      return result;
    }

    function getAnswerMoves(puzzle) {
      if (!puzzle) return [];
      const baseMoveCount = boardStatusToMoves(puzzle.boardStatus || '').length;
      return boardStatusToMoves(puzzle.answer || '', baseMoveCount);
    }

    function drawCommunityBoard(boardStatus, answer, answerStep) {
      const canvas = document.getElementById('communityBoardCanvas');
      const logicalSize = 360;
      const dpr = globalThis.devicePixelRatio || 1;
      canvas.width = logicalSize * dpr;
      canvas.height = logicalSize * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, logicalSize, logicalSize);
      ctx.fillStyle = '#f2d391';
      ctx.fillRect(0, 0, logicalSize, logicalSize);

      const padding = 28;
      const cell = (logicalSize - padding * 2) / 14;
      const toX = (col) => padding + col * cell;
      const toY = (row) => padding + (14 - row) * cell;

      ctx.strokeStyle = '#6d5736';
      ctx.lineWidth = 1;
      for (let i = 0; i < 15; i += 1) {
        const pos = padding + i * cell;
        ctx.beginPath();
        ctx.moveTo(pos, padding);
        ctx.lineTo(pos, logicalSize - padding);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding, pos);
        ctx.lineTo(logicalSize - padding, pos);
        ctx.stroke();
      }

      Array.of([3, 3], [3, 11], [7, 7], [11, 3], [11, 11]).forEach(([row, col]) => {
        ctx.fillStyle = '#3f3424';
        ctx.beginPath();
        ctx.arc(toX(col), toY(row), 2.8, 0, Math.PI * 2);
        ctx.fill();
      });

      function drawStone(move, number) {
        const x = toX(move.col);
        const y = toY(move.row);
        const isBlack = move.player === 'black';
        ctx.fillStyle = isBlack ? '#111827' : '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = isBlack ? '#111827' : '#9ca3af';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        if (number != null) {
          ctx.fillStyle = isBlack ? '#ffffff' : '#111827';
          ctx.font = '700 12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(number), x, y);
        }
      }

      const baseMoves = boardStatusToMoves(boardStatus);
      baseMoves.forEach((move) => drawStone(move, null));
      const answerMoves = boardStatusToMoves(answer, baseMoves.length);
      const visibleAnswerStep = Number.isFinite(answerStep)
        ? Math.max(0, Math.min(answerStep, answerMoves.length))
        : answerMoves.length;
      answerMoves.slice(0, visibleAnswerStep).forEach((move, index) => {
        drawStone(move, index + 1);
      });
    }

    function updateAnswerNavigation() {
      const answerMoves = getAnswerMoves(currentPuzzle);
      const total = answerMoves.length;
      currentAnswerStep = Math.max(0, Math.min(currentAnswerStep, total));
      document.getElementById('communityAnswerStep').textContent = adminT('communityPuzzles.answerProgress', {
        current: currentAnswerStep,
        total
      });
      document.getElementById('communityAnswerPrevBtn').disabled = currentAnswerStep <= 0;
      document.getElementById('communityAnswerNextBtn').disabled = currentAnswerStep >= total;
      drawCommunityBoard(currentPuzzle?.boardStatus || '', currentPuzzle?.answer || '', currentAnswerStep);
    }

    function renderPuzzle(puzzle, options = {}) {
      currentPuzzle = puzzle;
      const shouldKeepAnswerStep = options.keepAnswerStep === true;
      const totalAnswerMoves = getAnswerMoves(puzzle).length;
      currentAnswerStep = shouldKeepAnswerStep
        ? Math.min(currentAnswerStep, totalAnswerMoves)
        : totalAnswerMoves;
      document.getElementById('communityPuzzlePanel').hidden = false;
      document.getElementById('communityIsVerified').checked = Boolean(puzzle.isVerified);
      updateAnswerNavigation();
    }

    async function searchPuzzle(event) {
      event.preventDefault();
      setStatus('');
      document.getElementById('communityPuzzlePanel').hidden = true;
      const puzzleId = document.getElementById('communityPuzzleId').value.trim();
      if (!puzzleId) {
        setStatus(adminT('communityPuzzles.noPuzzle'));
        return;
      }
      const button = document.getElementById('communitySearchBtn');
      button.disabled = true;
      try {
        const res = await fetchWithAuth(API_BASE + '/admin/community/puzzle-manage/' + encodeURIComponent(puzzleId));
        if (!res) return;
        const data = await res.json();
        if (!res.ok || !data.isSuccess || !data.response) {
          setStatus(adminT('communityPuzzles.noPuzzle'));
          return;
        }
        renderPuzzle(data.response);
      } catch (err) {
        adminToast(adminT('common.errorPrefix', { message: err.message || '' }), 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function saveVerification() {
      if (!currentPuzzle) return;
      const verificationInput = document.getElementById('communityIsVerified');
      const previousValue = Boolean(currentPuzzle.isVerified);
      const nextValue = verificationInput.checked;
      verificationInput.disabled = true;
      try {
        const res = await fetchWithAuth(API_BASE + '/admin/community/puzzle-manage/' + encodeURIComponent(currentPuzzle.id) + '/verification', {
          method: 'PATCH',
          body: JSON.stringify({
            isVerified: nextValue
          })
        });
        if (!res) return;
        const data = await res.json();
        if (!res.ok || !data.isSuccess || !data.response) {
          verificationInput.checked = previousValue;
          adminToast(adminT('communityPuzzles.saveFailed'), 'error');
          return;
        }
        renderPuzzle(data.response, { keepAnswerStep: true });
        adminToast(adminT('communityPuzzles.saved'), 'success');
      } catch (err) {
        verificationInput.checked = previousValue;
        adminToast(adminT('common.errorPrefix', { message: err.message || '' }), 'error');
      } finally {
        verificationInput.disabled = false;
      }
    }

    document.getElementById('communitySearchForm').addEventListener('submit', searchPuzzle);
    document.getElementById('communityIsVerified').addEventListener('change', saveVerification);
    document.getElementById('communityAnswerPrevBtn').addEventListener('click', () => {
      currentAnswerStep -= 1;
      updateAnswerNavigation();
    });
    document.getElementById('communityAnswerNextBtn').addEventListener('click', () => {
      currentAnswerStep += 1;
      updateAnswerNavigation();
    });
    document.addEventListener('admin:language-change', () => {
      if (currentPuzzle) {
        renderPuzzle(currentPuzzle, { keepAnswerStep: true });
      } else if (!document.getElementById('communityPuzzleStatus').hidden) {
        setStatus(adminT('communityPuzzles.noPuzzle'));
      }
    });
  </script>
</body>
</html>
