<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Renzzle Admin Fragments</title>
</head>
<body>
<!-- Main navigation. `active` names the highlighted tab: 'packs' | 'communityPuzzles' | 'puzzleCache' | 'notices' | 'payments' | 'adminAccounts' -->
<th:block th:fragment="siteNav(active)">
  <!--/*@thymesVar id="adminPermissions" type="java.util.Set<java.lang.String>"*/-->
  <nav class="site-nav-wrap" aria-label="Main menu">
    <div class="site-nav">
      <a th:if="${adminPermissions?.contains('PACK_MANAGE')}" th:classappend="${active == 'packs'} ? 'active'" th:href="@{/admin/pack-list}" data-i18n="nav.packs">Pack</a>
      <a th:if="${adminPermissions?.contains('COMMUNITY_MANAGE')}" th:classappend="${active == 'communityPuzzles'} ? 'active'" th:href="@{/admin/community-puzzles}" data-i18n="nav.communityPuzzles">Community Puzzles</a>
      <a th:if="${adminPermissions?.contains('AI_RESPONSE_MANAGE')}" th:classappend="${active == 'puzzleCache'} ? 'active'" th:href="@{/admin/puzzle-cache}" data-i18n="nav.responseMoves">AI Responses</a>
      <a th:if="${adminPermissions?.contains('OPERATION_MANAGE')}" th:classappend="${active == 'notices'} ? 'active'" th:href="@{/admin/notices}" data-i18n="nav.notices">Notices</a>
      <a th:if="${adminPermissions?.contains('OPERATION_MANAGE')}" th:classappend="${active == 'payments'} ? 'active'" th:href="@{/admin/payments}" data-i18n="nav.payments">Payments</a>
      <a th:if="${adminPermissions?.contains('OPERATION_MANAGE')}" th:classappend="${active == 'adminAccounts'} ? 'active'" th:href="@{/admin/admin-accounts}" data-i18n="nav.adminAccounts">Admins</a>
    </div>
  </nav>
  <!-- On narrow screens the tabs scroll sideways, so bring the current one into view -->
  <script>document.querySelector('.site-nav a.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });</script>
</th:block>

<th:block th:fragment="languageSelect">
  <div class="admin-language-control">
    <label for="adminLanguageSelect" class="admin-language-icon">
      <span class="admin-visually-hidden" data-i18n="common.language">Language</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20"></path>
        <path d="M12 2a15.3 15.3 0 0 1 0 20"></path>
        <path d="M12 2a15.3 15.3 0 0 0 0 20"></path>
      </svg>
    </label>
    <select id="adminLanguageSelect" data-admin-language-select aria-label="Language">
      <option value="en" lang="en">English</option>
      <option value="ko" lang="ko">한국어</option>
    </select>
  </div>
</th:block>

<!-- Shared UI kit: toast and confirm modal (globalThis.adminToast / globalThis.adminConfirm) -->
<div th:fragment="uiKit" class="admin-ui-kit">
  <div id="adminToastWrap" popover="manual"></div>
  <dialog id="adminModalDialog" class="admin-modal" aria-labelledby="adminModalMsg">
    <div class="modal-msg" id="adminModalMsg"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn" id="adminModalCancel" data-i18n="common.cancel">Cancel</button>
      <button type="button" class="modal-btn danger" id="adminModalOk" data-i18n="common.check">Check</button>
    </div>
  </dialog>
  <script>
    (function () {
      globalThis.adminToast = function (message, type) {
        let wrap = document.getElementById('adminToastWrap');
        if (!wrap) { alert(message); return; }
        // A modal dialog sits in the top layer, so the toast re-enters it to stay above the most recent one
        if (typeof wrap.showPopover === 'function') {
          if (wrap.matches(':popover-open')) wrap.hidePopover();
          wrap.showPopover();
        }
        let el = document.createElement('div');
        el.className = 'admin-toast' + (type ? ' ' + type : '');
        el.textContent = message;
        wrap.appendChild(el);
        requestAnimationFrame(function () { el.classList.add('show'); });
        setTimeout(function () {
          el.classList.remove('show');
          setTimeout(function () {
            el.remove();
            if (!wrap.children.length && typeof wrap.hidePopover === 'function' && wrap.matches(':popover-open')) {
              wrap.hidePopover();
            }
          }, 250);
        }, 3000);
      };
      globalThis.adminConfirm = function (message, opts) {
        opts = opts || {};
        return new Promise(function (resolve) {
          let dialog = document.getElementById('adminModalDialog');
          if (!dialog) { resolve(globalThis.confirm(message)); return; }
          let msg = document.getElementById('adminModalMsg');
          let ok = document.getElementById('adminModalOk');
          let cancel = document.getElementById('adminModalCancel');
          msg.textContent = message;
          ok.textContent = opts.confirmText || (globalThis.adminT ? globalThis.adminT('common.check') : 'Check');
          cancel.textContent = opts.cancelText || (globalThis.adminT ? globalThis.adminT('common.cancel') : 'Cancel');
          ok.className = 'modal-btn ' + (opts.danger === false ? 'primary' : 'danger');
          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
          } else {
            dialog.setAttribute('open', '');
          }
          function cleanup(result) {
            if (dialog.open && typeof dialog.close === 'function') {
              dialog.close();
            } else {
              dialog.removeAttribute('open');
            }
            ok.removeEventListener('click', onOk);
            cancel.removeEventListener('click', onCancel);
            dialog.removeEventListener('click', onBackdrop);
            dialog.removeEventListener('cancel', onCancel);
            resolve(result);
          }
          function onOk() { cleanup(true); }
          function onCancel(e) {
            if (e) e.preventDefault();
            cleanup(false);
          }
          function onBackdrop(e) {
            const rect = dialog.getBoundingClientRect();
            const outside = e.clientX < rect.left || e.clientX > rect.right
              || e.clientY < rect.top || e.clientY > rect.bottom;
            if (outside) cleanup(false);
          }
          ok.addEventListener('click', onOk);
          cancel.addEventListener('click', onCancel);
          dialog.addEventListener('click', onBackdrop);
          dialog.addEventListener('cancel', onCancel);
        });
      };
    })();
  </script>
</div>
</body>
</html>
